spring:
  datasource:
    url: jdbc:mysql://localhost:3306/datapilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      api-key: ${LLM_API_KEY}
      base-url: ${LLM_BASE_URL}
      chat:
        completions-path: ${LLM_CHAT_PATH:/v1/chat/completions}
        options:
          model: ${LLM_MODEL}
          temperature: 0.2

mybatis:
  mapper-locations: classpath:mapper/*.xml

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.datapilot: DEBUG
    com.datapilot.mapper: DEBUG

datapilot:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 7200000
  security:
    datasource-aes-key: ${DATASOURCE_AES_KEY}